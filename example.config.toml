[llm]
provider = "deepseek"
model = "deepseek-chat"
api_key = ""
base_url = "https://api.deepseek.com"
temperature = 0.7
max_tokens = 1024

[mongodb]
uri = "mongodb://localhost:27017"
database = "manus_web_agent"
username = ""
password = ""

[redis]
host = "localhost"
port = 6379
db = 0
password = ""

[sandbox]
address = "http://localhost:8080"
image = "codeweiz/manus-web-agent-sandbox:latest"
name_prefix = "manus-web-agent-sandbox"
ttl_minutes = 30
network = "manus-web-agent"
chrome_args = "--no-sandbox --disable-dev-shm-usage"

[search]
provider = "bing"
api_key = ""
engine_id = ""

[mcp]
config_path = "/etc/mcp.json"

[langsmith]
tracing = false
api_key = ""
