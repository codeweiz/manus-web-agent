[project]
name = "manus-web-agent"
version = "0.1.0"
description = "A tribute to Manus, dedicated to build the best web agents"
readme = "README.md"
authors = [
    { name = "codeweiz", email = "13955645241@163.com" }
]
requires-python = ">=3.11"
dependencies = [
    "async-lru>=2.1.0",
    "beanie>=2.0.1",
    "beautifulsoup4>=4.14.3",
    "cryptography>=46.0.3",
    "deepagents>=0.3.3",
    "docker>=7.1.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "langchain-deepseek>=1.0.1",
    "langsmith>=0.6.4",
    "markdownify>=1.2.2",
    "mcp>=1.25.0",
    "motor>=3.7.1",
    "openai>=2.15.0",
    "playwright>=1.57.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "redis>=7.1.0",
    "rich>=14.2.0",
    "sse-starlette>=3.2.0",
    "tomli>=2.4.0",
    "uvicorn>=0.40.0",
    "websockets>=16.0",
]

[project.scripts]
manus-web-agent = "manus_web_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
